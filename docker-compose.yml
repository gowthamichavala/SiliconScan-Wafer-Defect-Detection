version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wafer_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/wafer_history.db:/app/backend/wafer_history.db
      - ./ml/checkpoints:/app/ml/checkpoints
      - ./results:/app/results
      - ./samples:/app/samples
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wafer_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
